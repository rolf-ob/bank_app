{% extends "base.html" %}

{% block style %}
<style>
    .auth-card {
        width: min(480px, 100%);
        margin: 65px auto;
        padding: 42px;
        border: 1px solid rgba(255,255,255,.9);
        border-radius: 22px;
        background: rgba(255,255,255,.88);
        box-shadow: var(--shadow);
    }

    .auth-card h1 {
        margin: 0 0 10px;
        text-align: center;
        font-size: 30px;
        letter-spacing: -.04em;
    }

    .auth-description {
        margin: 0 0 30px;
        color: var(--muted);
        text-align: center;
        font-size: 14px;
        line-height: 1.6;
    }

    .auth-card label {
        display: block;
        margin: 17px 0 7px;
        font-size: 13px;
        font-weight: 700;
    }

    .auth-input {
        width: 100%;
        height: 51px;
        padding: 0 14px;
        border: 1px solid #dce7e1;
        border-radius: 10px;
        background: #f9fbfa;
        color: var(--ink);
    }

    .auth-submit {
        width: 100%;
        margin-top: 25px;
    }

    .auth-footer {
        margin: 22px 0 0;
        color: var(--muted);
        text-align: center;
        font-size: 13px;
    }

    .auth-footer a {
        color: var(--brand);
        font-weight: 700;
        text-decoration: none;
    }

    @media (max-width: 550px) {
        .auth-card {
            margin: 35px auto;
            padding: 30px 22px;
        }
    }
</style>
{% endblock %}

{% block body %}
<section class="auth-card">
    <h1>Create your account</h1>
    <p class="auth-description">
        Get started by creating your personal account.
    </p>

    <form action="{{ url_for('create_user') }}" method="POST">
        <label for="email">Email address</label>
        <input class="auth-input"
               type="email"
               id="email"
               name="email"
               autocomplete="email"
               placeholder="you@example.com"
               required>

        <label for="password">Password</label>
        <input class="auth-input"
               type="password"
               id="password"
               name="password"
               autocomplete="new-password"
               placeholder="Choose a password"
               required>

        <button class="primary-button auth-submit" type="submit">
            Create account
        </button>
    </form>

    <p class="auth-footer">
        Already have an account?
        <a href="{{ url_for('log_in') }}">Log in</a>
    </p>
</section>
{% endblock %}
