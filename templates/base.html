<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Bank App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: light;
            --ink: #172b35;
            --muted: #71818a;
            --brand: #087f70;
            --brand-dark: #06675d;
            --mint: #e2f3ec;
            --paper: #f3f7f5;
            --line: #e3ebe7;
            --white: #fff;
            --danger: #b94c47;
            --shadow: 0 20px 60px rgba(28, 61, 55, .09);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 0 28px 50px;
            color: var(--ink);
            background:
                radial-gradient(ellipse at 10% 15%, rgba(198,231,216,.45), transparent 35%),
                radial-gradient(ellipse at 90% 80%, rgba(217,235,226,.5), transparent 35%),
                var(--paper);
            font-family: 'DM Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button, input {
            font: inherit;
        }

        button, a, input {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible, a:focus-visible, input:focus-visible {
            outline: 3px solid rgba(8,127,112,.25);
            outline-offset: 3px;
        }

        h1, h2, h3 {
            font-family: 'Manrope', sans-serif;
        }

        .site-header {
            width: min(1400px, 100%);
            min-height: 86px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(210,224,217,.8);
        }

        .brand {
            color: var(--ink);
            text-decoration: none;
            font-family: 'Manrope', sans-serif;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: .13em;
        }

        .brand::before {
            content: '';
            display: inline-block;
            width: 11px;
            height: 11px;
            margin-right: 10px;
            border-radius: 4px 4px 4px 1px;
            background: var(--brand);
            transform: rotate(-12deg);
        }

        .site-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            padding: 10px 15px;
            border-radius: 10px;
            color: #52656c;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background .2s, color .2s;
        }

        .nav-link:hover {
            color: var(--brand-dark);
            background: #e7f2ed;
        }

        .page-container {
            width: min(1400px, 100%);
            margin: 0 auto;
        }

        .flash {
            width: fit-content;
            max-width: 100%;
            margin: 14px auto;
            padding: 11px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .flash.success {
            color: #176b4e;
            background: #e5f5ec;
            border: 1px solid #c9e9d7;
        }

        .flash.error {
            color: #a43b3b;
            background: #fff0ee;
            border: 1px solid #f3d4cf;
        }

        .primary-button, .secondary-button, .danger-button {
            min-height: 44px;
            padding: 0 17px;
            border: 0;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }

        .primary-button {
            color: white;
            background: var(--brand);
        }

        .primary-button:hover {
            background: var(--brand-dark);
            transform: translateY(-1px);
        }

        .secondary-button {
            color: var(--ink);
            background: #edf2ef;
        }

        .secondary-button:hover {
            background: #e1eae5;
        }

        .danger-button {
            color: var(--danger);
            background: #fff0ee;
        }

        .danger-button:hover {
            color: white;
            background: var(--danger);
        }

        @media (max-width: 600px) {
            body {
                padding: 0 15px 35px;
            }

            .site-header {
                min-height: 76px;
                gap: 12px;
            }

            .brand {
                font-size: 15px;
            }

            .site-nav {
                gap: 0;
            }

            .nav-link {
                padding: 9px 8px;
                font-size: 12px;
            }
        }
    </style>

    {% block style %}{% endblock %}
</head>

<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}">BANK APP</a>

        <nav class="site-nav">
            <a class="nav-link" href="{{ url_for('index') }}">Home</a>

            {% if current_user %}
                <a class="nav-link" href="{{ url_for('user') }}">User</a>
            {% else %}
                <a class="nav-link" href="{{ url_for('log_in') }}">Log In</a>
                <a class="nav-link" href="{{ url_for('sign_in') }}">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <main class="page-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}" role="status">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block body %}{% endblock %}
    </main>
</body>
</html>
