{% extends "base.html" %}

{% block style %}
<style>
    .user-card {
        width: min(520px, 100%);
        margin: 65px auto;
        padding: 42px;
        border: 1px solid rgba(255,255,255,.9);
        border-radius: 22px;
        background: rgba(255,255,255,.88);
        box-shadow: var(--shadow);
    }

    .user-card h1 {
        margin: 0 0 8px;
        text-align: center;
        font-size: 30px;
    }

    .user-description {
        margin: 0 0 28px;
        color: var(--muted);
        text-align: center;
        font-size: 14px;
    }

    .user-email {
        padding: 18px;
        border: 1px solid #e0eee7;
        border-radius: 12px;
        background: #f1f8f4;
        text-align: center;
        overflow-wrap: anywhere;
    }

    .user-email span {
        display: block;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .user-card form {
        margin-top: 15px;
    }

    .user-card button {
        width: 100%;
    }

    .user-card label {
        display: block;
        margin: 23px 0 8px;
        font-size: 13px;
        font-weight: 700;
    }

    .user-card input {
        width: 100%;
        height: 49px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fbfdfc;
    }

    .delete-section {
        margin-top: 30px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
    }

    .delete-section h2 {
        margin: 0;
        color: var(--danger);
        font-size: 17px;
    }

    .delete-section p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
    }

    @media (max-width: 550px) {
        .user-card {
            margin: 35px auto;
            padding: 30px 22px;
        }
    }
</style>
{% endblock %}

{% block body %}
<section class="user-card">
    <h1>Your profile</h1>
    <p class="user-description">Manage your account settings.</p>

    <div class="user-email">
        <span>Username</span>
        <strong>{{ current_user.name }}</strong>
    </div>

    <form action="{{ url_for('log_out') }}" method="POST">
        <button class="primary-button" type="submit">Log out</button>
    </form>

    <div class="delete-section">
        <h2>Delete your user</h2>
        <p>
            This is a permanent action. Make sure you understand what
            will happen to your accounts before continuing.
        </p>

        <form action="{{ url_for('delete_user_route') }}" method="POST">
            <label for="deleteUserPassword">Confirm your password</label>
            <input type="password"
                   id="deleteUserPassword"
                   name="password"
                   autocomplete="current-password"
                   required>

            <button class="danger-button" type="submit" style="margin-top:12px;">
                Delete user
            </button>
        </form>
    </div>
</section>
{% endblock %}
