{% extends "base.html" %}

{% block style %}
<style>
    #login {
        width: min(510px, 100%);
        min-height: 440px;
        margin: 70px auto 0;
        padding: 48px 52px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: stretch;
        border: 1px solid rgba(255,255,255,.95);
        border-radius: 24px;
        background: rgba(255,255,255,.86);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
    }
    #title {
        margin: 0 0 30px;
        color: var(--ink);
        font-size: clamp(25px, 4vw, 32px);
        line-height: 1.2;
        letter-spacing: -.045em;
        text-align: center;
    }
    #login_textboxes { display: flex; flex-direction: column; gap: 13px; }
    .textbox {
        width: 100%;
        height: 54px;
        margin: 0;
        padding: 0 17px;
        border: 1px solid #dce7e1;
        border-radius: 11px;
        color: var(--ink);
        background: #f9fbfa;
        font-size: 15px;
        transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .textbox::placeholder { color: #9aa9a3; }
    .textbox:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 4px rgba(8,127,112,.09); outline: none; }
    #login_buttons { display: flex; justify-content: center; margin-top: 23px; }
    .button {
        width: 100%;
        min-height: 52px;
        margin: 0;
        padding: 0 20px;
        border: 0;
        border-radius: 11px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: background .2s, transform .2s, box-shadow .2s;
    }
    #log_in_button {
        color: #fff;
        background: var(--brand);
        box-shadow: 0 8px 18px rgba(8,127,112,.2);
    }
    #log_in_button:hover { background: var(--brand-dark); transform: translateY(-2px); box-shadow: 0 11px 22px rgba(8,127,112,.25); }
    @media (max-width: 560px) { #login { margin-top: 38px; padding: 38px 25px; min-height: 400px; } }
</style>
{% endblock %}

{% block body %}
<div id="login">
    <h1 id="title">LOG IN TO ACCOUNT</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form action="/log_into_account" method="POST">
        <div id="login_textboxes">
            <input type="email" name="email" class="textbox" placeholder="Email address">
            <input type="password" name="password" class="textbox" placeholder="Password">
        </div>
        <div id="login_buttons">
            <button class="button" id="log_in_button" name="action">Log In</button>
        </div>
    </form>
</div>
{% endblock %}
